<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Instagram - GetUserFeed</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1116;
      color: #e6e9ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .panel {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid #2a313c;
      border-radius: 8px;
      background: #151a22;
      padding: 22px;
    }
    .title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .msg {
      color: #9aa7b7;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .btn {
      margin-top: 18px;
      border: 1px solid #2f81f7;
      border-radius: 7px;
      background: #1f6feb;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 14px;
    }
    .btn:disabled {
      cursor: wait;
      opacity: .65;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1 class="title" id="title">Preparing Instagram session</h1>
    <div class="msg" id="msg">Fetching the stored cookies...</div>
    <button class="btn" id="retry" style="display:none">Try again</button>
  </main>

  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('sessionId');
      const debug = params.get('debug') === '1';
      const token = localStorage.getItem('admin_token');
      const title = document.getElementById('title');
      const msg = document.getElementById('msg');
      const retry = document.getElementById('retry');
      let requestedSessionId = sessionId;
      let resolvedSessionId = sessionId;

      function setState(nextTitle, nextMsg, canRetry) {
        title.textContent = nextTitle;
        msg.textContent = nextMsg;
        retry.style.display = canRetry ? 'inline-block' : 'none';
      }

      function fail(text) {
        setState('Could not open Instagram', text, true);
      }

      function waitForExtension() {
        return new Promise(function (resolve) {
          var done = false;
          function onMessage(event) {
            if (event.source !== window || !event.data) return;
            if (event.data.type !== 'GETIGFEED_EXTENSION_READY') return;
            done = true;
            window.removeEventListener('message', onMessage);
            resolve(true);
          }
          window.addEventListener('message', onMessage);
          window.postMessage({ type: 'GETIGFEED_PING' }, window.location.origin);
          setTimeout(function () {
            if (done) return;
            window.removeEventListener('message', onMessage);
            resolve(false);
          }, 1200);
        });
      }

      function openInstagram() {
        if (!token) {
          fail('No admin token found. Open the admin dashboard, unlock it, then click View again.');
          return;
        }
        if (!sessionId) {
          fail('No session ID was provided.');
          return;
        }

        retry.disabled = true;
        setState('Preparing Instagram session', 'Checking for the Chrome extension...', false);

        waitForExtension()
          .then(function (hasExtension) {
            if (!hasExtension) {
              throw new Error('GetIGFeed Session Opener extension was not detected. Load or reload the extension, then click View again.');
            }
            setState('Preparing Instagram session', 'Fetching the stored cookies...', false);
            return fetch('/admin/sessions/' + encodeURIComponent(sessionId) + '/cookies', {
              method: 'GET',
              headers: {
                'x-admin-token': token,
              },
            });
          })
          .then(function (r) {
            if (!r.ok) {
              return r.json().then(function (d) {
                throw new Error(d.error || 'HTTP ' + r.status);
              });
            }
            return r.json();
          })
          .then(function (d) {
            if (!d.cookies || !d.cookies.length) {
              throw new Error('No cookies were returned for this session.');
            }
            requestedSessionId = d.requestedSessionId || requestedSessionId;
            resolvedSessionId = d.sessionId || resolvedSessionId;
            setState('Opening Instagram', 'Applying cookies in Chrome...', false);
            window.postMessage({
              type: 'GETIGFEED_OPEN_INSTAGRAM',
              cookies: d.cookies,
              url: 'https://www.instagram.com/',
              debug: debug,
            }, window.location.origin);
          })
          .catch(function (err) {
            retry.disabled = false;
            fail(err.message || 'Unknown error.');
          });
      }

      window.addEventListener('message', function (event) {
        if (event.source !== window || !event.data) return;
        if (event.data.type === 'GETIGFEED_EXTENSION_ERROR') {
          retry.disabled = false;
          fail(event.data.error || 'The extension could not set Instagram cookies.');
        } else if (event.data.type === 'GETIGFEED_EXTENSION_DONE' && debug) {
          const result = event.data.result || {};
          const names = (result.cookies || []).map(function (cookie) {
            return cookie.name + ' [' + cookie.domain + (cookie.hostOnly ? ', host-only' : ', domain') + ']';
          });
          retry.disabled = false;
          setState(
            'Cookies written',
            'Requested session: ' + (requestedSessionId || 'none') + '\n' +
              'Resolved session: ' + (resolvedSessionId || 'none') + '\n' +
              'Store: ' + (result.storeId || 'unknown') + '\n' +
              'Removed old cookies: ' + (result.removed || 0) + '\n' +
              'Written cookies: ' + (result.written || 0) + '\n\n' +
              (names.length ? names.join('\n') : 'No Instagram cookies visible to Chrome.'),
            true
          );
        }
      });

      retry.addEventListener('click', openInstagram);
      openInstagram();
    })();
  </script>
</body>
</html>
