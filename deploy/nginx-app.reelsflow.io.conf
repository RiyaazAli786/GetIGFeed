# Host-nginx reverse proxy for app.reelsflow.io -> the getigfeed container
# (127.0.0.1:3000). Install at /etc/nginx/sites-available/app.reelsflow.io,
# symlink into sites-enabled, then run certbot --nginx to fill in the TLS
# block below automatically.
#
#   sudo cp deploy/nginx-app.reelsflow.io.conf /etc/nginx/sites-available/app.reelsflow.io
#   sudo ln -s /etc/nginx/sites-available/app.reelsflow.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.reelsflow.io

server {
    listen 80;
    listen [::]:80;
    server_name app.reelsflow.io;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Some /api/instagram/download/zip and SSE endpoints (zip job events)
        # stream — don't buffer or apply a short read timeout to them.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    client_max_body_size 5m;
}
