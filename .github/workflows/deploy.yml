name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 "$USER@$HOST" '
            set -e
            git config --global --add safe.directory /opt/getigfeed || true
            cd /opt/getigfeed
            git fetch origin main
            git reset --hard origin/main
            if command -v docker &>/dev/null && docker compose version &>/dev/null; then
              docker compose up -d --build --remove-orphans
            elif command -v docker-compose &>/dev/null; then
              docker-compose up -d --build --remove-orphans
            else
              sudo docker compose up -d --build --remove-orphans
            fi
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
                echo "GetIGFeed is healthy"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "GetIGFeed did not become healthy after restart"
                docker compose ps || true
                docker compose logs --tail=120 getigfeed || true
                exit 1
              fi
              sleep 2
            done
            docker image prune -f || true
          '
